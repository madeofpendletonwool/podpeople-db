[package]
name = "podpeople"
version = "2.0.0"
edition = "2021"
rust-version = "1.99"
description = "PodPeopleDB: the open database of podcast hosts and guests"
license = "GPL-3.0"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
tokio = { version = "1.54.0", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace", "cors", "compression-gzip", "timeout", "set-header"] }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "chrono", "json", "migrate"] }

reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls", "gzip", "stream"] }
quick-xml = "0.42.0"
url = "2.5.8"

askama = "0.16.1"
rust-embed = "8.13.0"
mime_guess = "2.0.5"

argon2 = "0.6.0"
bcrypt = "0.19.3"
rand = "0.10.3"
sha2 = "0.11.0"
hex = "0.4.3"

tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.21"
futures = "0.3.34"
unicode-normalization = "0.1.26"
urlencoding = "2.1.3"
bytes = "1.12.1"
tempfile = "3.27.0"

[dev-dependencies]
http-body-util = "0.1"

[profile.release]
lto = "thin"
strip = true
